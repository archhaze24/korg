name: CI

# Manual only while the repository is private (GitHub Free minutes): start it from the Actions
# tab or with `gh workflow run ci.yml`. Switch to push/pull_request triggers when the repository
# goes public, where Actions are free.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  e2e:
    name: end-to-end (Linux, real tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install opusenc, rsgain, flac, lame
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install opus-tools rsgain flac lame
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - run: cargo test --test e2e
        env:
          KORG_E2E_REQUIRE: "1"
