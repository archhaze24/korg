[package]
name = "korg"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Kirby's music organizer: tidy covers, fetch synced lyrics, encode FLAC to Opus, add ReplayGain"
license = "MIT"
repository = "https://github.com/archhaze24/korg"
readme = "README.md"
keywords = ["music", "flac", "opus", "replaygain", "lrc"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1.0.104"
caseless = "0.2.2"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
console = "0.16.6"
ctrlc = "3.5.2"
dirs = "7.0.0"
dunce = "1.0.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
indicatif = "0.18.6"
jpeg-encoder = "0.7.1"
lofty = "0.25.5"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
unicode-properties = "0.1.5"
ureq = { version = "3.5.2", features = ["json"] }
uuid = { version = "1.29.2", features = ["v4"] }
walkdir = "2.5.0"
which = "8.0.6"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
